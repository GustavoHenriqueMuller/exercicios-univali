<html>
    <head>
        <meta charset="UTF-8"/>
    </head>
    <body>
        <form method="post">
            <label>Nome: </label>
            <input name="nome" id="nome" type="text" maxlength="70"/><br>

            <label>Email: </label>
            <input name="email" id="email" type="text" maxlength="70"/><br>

            <label>Portador de necessidades especiais: </label>
            Sim:<input name="necessidadeEspecial" type="radio" value="sim"/>
            Não:<input name="necessidadeEspecial" type="radio" value="não"/><br>

            <label>CPF: </label>
            <input name="cpf" type="text" maxlength="12"/><br>

            <label>Município para realização da prova: </label>
            <select name="municipio">
                <option value="4202008">Balneário Camboriú</option>
                <option value="4208203">Itajaí</option>
                <option value="4202909">Brusque</option>
                <option value="4202404">Blumenau</option>
                <option value="4211306">Navegantes</option>
            </select><br>

            <label>Linguagem de programação de preferência: </label>
            <select name="lingugagemDeProgramacao">
                <option>Node.js</option>
                <option>PHP</option>
                <option>Java</option>
                <option>C#</option>
                <option>C++</option>
            </select><br>
            
            <label>Experiência Prévia: </label>
            <select name="experienciaPrevia" multiple>
                <option>Desenvolvedor</option>
                <option>Web Designer</option>
                <option>Tester</option>
                <option>Analista de Requisitos</option>
                <option>DBA</option>
            </select><br>

            <label>Observações: </label>
            <textarea name="observacoes"></textarea><br>

            <label>Senha: </label>
            <input name="senha" type="password"><br>

            <label>Confirmação da Senha: </label>
            <input name="senhaConfirmada" type="password"><br>

            <input type="submit" text="Enviar">
        </form>
    </body>
</html>
