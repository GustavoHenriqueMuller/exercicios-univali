<! DOCTYPE html>
<html>
	<head>
		<title>Fundação Univali</title>
		<meta charset="utf-8"/>
	</head>
	
	<body bgcolor="#004887" text="white">
		<!-- BANNER DE COVID -->
		<div name="covidDiv" align="left">
			<table width="100%" bgcolor="#009e80" height="5%">
				<tr>
					<td>
						<div>
							<img src="images/covidWarning.png"/>
						</div>
					</td>
					<td>
						<div align="left">
							<div>Covid-19: O cuidado depende de todos nós</div>
						</div>
					</td>
				</tr>
			</table>
		</div>
		
		<br>

		<!-- MENU PRINCIPAL, LOGIN, EMAIL E INTERNACIONAL -->
		<div name="mainDiv" align="center">
			<table width="75%">
				<tr>
					<td>
						<div>
							<img src="images/logo.png"/>
						</div>
					</td>
					<td>
						<div align="right">
							<img src="images/login.png"/> Minha Univali |
							<img src="images/mail.png"/> Meu E-mail |
							<img src="images/internacional.png"/> Internacional
						</div>
					</td>
				</tr>
			</table>
		</div>
		
		<br>
		
		<!-- ANÚNCIO DE MIL BOLSAS 100% -->
		<div name="milBolsasDiv" align="center">
			<img src="images/milBolsas.png" alt="Mil Bolsas de até 100%, Presencial e EAD. Inscreva-se."/>
		</div>
		
		<br>
		
		<!-- ENTRAR NO PORTAL UNIVALI E QUERO SER ALUNO -->
		<div name="entrarPortal" align="left">
			<!-- ESQUERDA -->
			<table width="50%" align="left">
				<tr>
					<td>
						<div align="center">
							<button>Ambientes Virtuais - Apoio ao Presencial</button>
							<button>Concursos</button>
							<br>
							<button>Entrar no Portal Univali</button>
						</div>
					</td>
				</tr>
			</table>
			
			<!-- DIREITA -->
			<table width="50%" bgcolor="#ffffff" align="right">
				<tr>
					<td>
						<table align="left" bgcolor="#ffffff">
							<tr>
								<td>
									<div align="left">
										<font color="black">Quero ser aluno</font>
									</div>
								</td>
							</tr>
							
							<tr>
								<td>
									<button>Graduação - Inscreva-se</button>
								</td>
							</tr>
							
							<tr>
								<td>
									<button>Graduação - Resultados</button>
								</td>
							</tr>
								
							<tr>
								<td>
									<button>Pós-Graduação</button>
								</td>
							</tr>
								
							<tr>
								<td>
									<button>Idiomas</button>
								</td>
							</tr>
								
							<tr>
								<td>
									<button>Colégio de Aplicação</button>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				
				<tr>
					<td>
						<table align="right" bgcolor="#ffffff">
							<td>
								<img src="images/campanha.png" alt="Estudante sorrindo."/>
							</td>
						</table>
					</td>
				</tr>				
			</table>
		</div>		
	</body>
</html>
