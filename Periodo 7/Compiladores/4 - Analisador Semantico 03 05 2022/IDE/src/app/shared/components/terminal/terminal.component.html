<ng-container [formGroup]="form">

  <div class="flex justify-between items-center w-full h-9 text-white border-b border-davys-gray">
    <span>Terminal</span>
    <app-icon
      (click)="cleanTerminal()"
      [icon]="'TRASH'"
      [container]="'group w-9 h-full py-2.5 cursor-pointer bg-davys-gray/0 hover:bg-davys-gray/40'"
      [clazz]="'text-davys-gray group-hover:text-white'" class="h-full"></app-icon>
  </div>

  <textarea
    #terminal
    [formGroup]="form"
    [formControlName]="'terminal'"
    [spellcheck]="false"
    class="w-full h-full bg-transparent text-white focus:outline-none leading-relaxed overflow-auto resize-none"></textarea>

</ng-container>
